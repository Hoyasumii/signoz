name: Feature request
description: A missing operation, tool, dashboard preset, command or option.
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - SDK
        - MCP server
        - CLI
        - Docs site
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The call, tool or command you have in mind. For a SigNoz endpoint the SDK does not cover, say which SigNoz version has it and link its operation in that version's OpenAPI spec.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this.
