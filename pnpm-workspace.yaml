packages:
  - website

allowBuilds:
  # Its postinstall only falls back to a WASM build when the native binding is missing,
  # and pnpm installs the native one for the platform (under @docusaurus/faster).
  "@swc/core": false
  # Its postinstall only prints a funding banner.
  core-js: false

overrides:
  js-yaml: 4.3.2
  # gray-matter 4 (under docusaurus-plugin-llms) calls safeLoad, which js-yaml 4 removed;
  # 3.14.2 is the patched 3.x release.
  gray-matter>js-yaml: 3.14.2
  minimatch@3: 3.1.4
  handlebars: 4.7.9
  follow-redirects: 1.16.0
